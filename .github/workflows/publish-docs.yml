# Builds the Dokka multi-module docs site and deploys it to GitHub Pages.
# Requires the Pages source to be set to "GitHub Actions" in repo settings.
name: Publish docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Dokka docs
        run: ./gradlew assembleDocsSite --no-daemon

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4